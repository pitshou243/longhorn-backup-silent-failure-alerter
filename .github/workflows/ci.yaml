---
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile src/exporter.py
      - run: python -m json.tool grafana/longhorn-backup-dashboard.json >/dev/null
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: deploy monitoring .github/workflows
